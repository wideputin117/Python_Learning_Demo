[project]
name = "triagedesk"
version = "0.1.0"
description = "TriageDesk: AI-powered support ticket triage API (Python learning project)"
authors = [
    { name = "Manish", email = "manishsaingupta@smartdatainc.net" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs code blocks use aligned teaching comments, so keep ruff off markdown.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, UP = modern syntax, B = common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
